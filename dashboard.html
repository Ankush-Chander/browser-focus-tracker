<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>Focus Dashboard</title>

<link rel="stylesheet"
href="dashboard.css">

</head>

<body>

<div class="container">

<h1>Focus Dashboard</h1>

<div class="cards">

<div class="card">

<h3>Focus Score</h3>

<div id="focusScore"
class="score"></div>

<div id="focusLabel"></div>

</div>


<div class="card">

<h3>Total Time</h3>

<p id="browsingTime"></p>

</div>


<div class="card">

<h3>Tab Switches</h3>

<p id="switches"></p>

</div>


<div class="card">

<h3>Sites Visited</h3>

<p id="siteCount"></p>

</div>

</div>


<h2>Weekly Summary</h2>

<div class="cards">

    <div class="card">
        <h3>Weekly Average</h3>
        <p id="weeklyAverage"></p>
    </div>

    <div class="card">
        <h3>Best Day</h3>
        <p id="bestDay"></p>
    </div>

    <div class="card">
        <h3>Needs Improvement</h3>
        <p id="worstDay"></p>
    </div>

    <div class="card">
        <h3>Weekly Browsing</h3>
        <p id="weeklyTime"></p>
    </div>

    <div class="card">
        <h3>Weekly Switches</h3>
        <p id="weeklySwitches"></p>
    </div>

</div>

<h2>Top Websites</h2>

<div id="topSites"></div>

</div>

</div>

<script src="dashboard.js"></script>

</body>

</html>
