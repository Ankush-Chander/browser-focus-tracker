<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Focus Pulse</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="pop">
      <header class="pop-header">
        <p class="label">Focus Pulse</p>
        <h1>Today's reading</h1>
      </header>

      <section class="pop-reading" id="readingSection">
        <div class="gauge-wrap">
          <svg viewBox="0 0 200 128" class="gauge" aria-hidden="true">
            <path class="zone zone-low" d="M 10 110 A 90 90 0 0 1 100 20" />
            <path class="zone zone-mid" d="M 100 20 A 90 90 0 0 1 172.8 57.1" />
            <path
              class="zone zone-high"
              d="M 172.8 57.1 A 90 90 0 0 1 190 110"
            />

            <g id="needleGroup" transform="rotate(-90 100 110)">
              <line x1="100" y1="110" x2="100" y2="40" class="needle" />
              <circle cx="100" cy="110" r="5.5" class="pivot" />
            </g>
          </svg>

          <div class="reading-value">
            <span id="focusScore" class="score">--</span
            ><span class="score-suffix">/100</span>
          </div>

          <p id="focusLabel" class="reading-label">—</p>
        </div>

        <p class="empty-note" id="emptyNote">
          No browsing activity yet. Browse normally for a few minutes and return
          to see today's productivity insights.
        </p>
      </section>

      <dl class="readouts">
        <div class="readout">
          <dt>Open tabs</dt>
          <dd id="openTabs">--</dd>
        </div>

        <div class="readout" id="totalTimeReadout">
          <dt>Time</dt>
          <dd id="totalTime">--</dd>
        </div>

        <div class="readout" id="switchesReadout">
          <dt>Switches</dt>
          <dd id="switches">--</dd>
        </div>

        <div class="readout" id="maxTabsReadout">
          <dt>Peak tabs</dt>
          <dd id="maxTabs">--</dd>
        </div>
      </dl>

      <div class="readout">
        <dt>🏆 Most Used Today</dt>

        <dd id="topSite">-</dd>
      </div>

      <section class="pop-section">
        <h2>Top sites</h2>
        <ol class="sites" id="sites"></ol>
        <p class="empty-note" id="sitesEmptyNote">Nothing logged yet.</p>
      </section>

      <div class="actions">
        <button id="dashboardBtn" class="btn btn-primary">
          Open dashboard
        </button>

        <div class="actions-row">
          <button id="exportBtn" class="btn btn-ghost">Export JSON</button>

          <button id="exportCsvBtn" class="btn btn-ghost">Export CSV</button>

          <button id="resetBtn" class="btn btn-ghost btn-danger">
            Reset today
          </button>
        </div>
      </div>
    </div>

    <script type="module" src="popup.js"></script>

    <div id="toast" class="toast"></div>
  </body>
</html>
